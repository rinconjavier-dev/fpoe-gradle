<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html lang="es"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="jakarta.faces.core">
      
      <!--xmlns:f="http://xmlns.jcp.org/jsf/core"-->
      
    <h:head>
        <title></title>
    </h:head>
      
    <h:body>

        <h:form>

            <p:card>
                <f:facet name ="title"> Gestionar Asignaturas</f:facet>

                <h:panelGrid columns ="3">

                    <p:outputLabel for ="txfCodigo" value = "Código: " ></p:outputLabel>
                    <p:inputText id ="txfCodigo" value="#{asignCtrl.asignatura.codigo}" required="true"></p:inputText>
                    <p:message for ="txfCodigo"></p:message>

                    <p:outputLabel for ="txfNombre" value = "Nombre: " ></p:outputLabel>
                    <p:inputText id ="txfNombre" value="#{asignCtrl.asignatura.nombre}" required="true"></p:inputText>
                    <p:message for ="txfNombre"></p:message>

                    <p:outputLabel for ="txfCreditos" value = "Créditos: " ></p:outputLabel>
                    <p:inputText id ="txfCreditos" value="#{asignCtrl.asignatura.creditos}" required="true"></p:inputText>
                    <p:message for ="txfCreditos"></p:message>

                    <p:outputLabel for ="txfIntensidad" value = "Intensidad: " ></p:outputLabel>
                    <p:inputText id ="txfIntensidad" value="#{asignCtrl.asignatura.intensidad}" required="true"></p:inputText>
                    <p:message for ="txfIntensidad"></p:message>

                </h:panelGrid>


                <p:messages id="mensajes" globalOnly="true" closable="true" ></p:messages>


                <f:facet name="footer">
                    <p:commandButton icon="pi pi-check" value="Guardar"
                                     action="#{asignCtrl.guardar()}"
                                     process="@this txfCodigo txfNombre txfCreditos txfIntensidad"
                                     update="mensajes txfCodigo txfNombre txfCreditos txfIntensidad tabla"/>
                    <p:commandButton icon="pi pi-times" value="Cancelar"
                                     styleClass="ui-button-secondary"
                                     style="margin-left: .5em"
                                     action="#{asignCtrl.cancelar()}"
                                     process="@this"
                                     update="mensajes txfCodigo txfNombre txfCreditos txfIntensidad"/>
                </f:facet>

            </p:card>

        </h:form>


        <p:dataTable id="tabla" value="#{asignCtrl.asignaturas}" var="obj">
            
            <p:column headerText="Código">#{obj.codigo}</p:column>
            <p:column headerText="Nombre">#{obj.nombre}</p:column>
            <p:column headerText="Créditos">#{obj.creditos}</p:column>
            <p:column headerText="Intensidad">#{obj.intensidad}</p:column>
            
        </p:dataTable>



<!--        <p:dataTable var="asignaturas" value="#{dtBasicView.asignaturas}">
            <p:column headerText="Código">
                <h:outputText value="#{asignaturas.codigo}" />
            </p:column>

            <p:column headerText="Asignatura">
                <h:outputText value="#{asignaturas.nombre}" />
            </p:column>

            <p:column headerText="Créditos">
                <h:outputText value="#{asignaturas.creditos}" />
            </p:column>

            <p:column headerText="Intensidad">
                <h:outputText value="#{asignaturas.intensidad}" />
            </p:column>
        </p:dataTable>-->

    </h:body>
</html>
