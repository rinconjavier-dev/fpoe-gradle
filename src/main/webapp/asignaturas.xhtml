<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html lang="es"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <h:head>
        <title></title>
    </h:head>
    <h:body>

        <p:card>
            <f:facet name ="title"> Gestionar Asignaturas</f:facet>
            
            <h:panelGrid columns ="3">
                
                <p:outputLabel for ="txfCodigo" value = "Código: " ></p:outputLabel>
                <p:inputText id ="txfCodigo"></p:inputText>
                <p:message for ="txfCodigo"></p:message>
                
                <p:outputLabel for ="txfNombre" value = "Nombre: " ></p:outputLabel>
                <p:inputText id ="txfNombre"></p:inputText>
                <p:message for ="txfNombre"></p:message>
                
                <p:outputLabel for ="txfCreditos" value = "Créditos: " ></p:outputLabel>
                <p:inputText id ="txfCreditos"></p:inputText>
                <p:message for ="txfCreditos"></p:message>
                
                <p:outputLabel for ="txfIntensidad" value = "Intensidad: " ></p:outputLabel>
                <p:inputText id ="txfIntensidad"></p:inputText>
                <p:message for ="txfIntensidad"></p:message>
                
            </h:panelGrid>
            
            
            <f:facet name ="footer"> 
                <p:commandButton icon="pi pi-check" value="Guardar"/>
                <p:commandButton icon="pi pi-times" value="Eliminar" styleClass="ui-button-secondary" style="margin-left: .5em"/>

            </f:facet>
        </p:card>
        
         <p:dataTable var="asignaturas" value="#{dtBasicView.asignaturas}">
            <p:column headerText="Código">
                <h:outputText value="#{asignaturas.codigo}" />
            </p:column>

            <p:column headerText="Asignatura">
                <h:outputText value="#{asignaturas.nombre}" />
            </p:column>

            <p:column headerText="Créditos">
                <h:outputText value="#{asignaturas.creditos}" />
            </p:column>

            <p:column headerText="Intensidad">
                <h:outputText value="#{asignaturas.intensidad}" />
            </p:column>
        </p:dataTable>

    </h:body>
</html>
